# Optional overlay ONLY when Kaiten is intentionally moved onto the bot host.
# docker compose -f docker-compose.yml -f docker-compose.with-kaiten.yml ...
services:
  kaiten:
    build: ../kaiten
    restart: unless-stopped
    env_file: ../kaiten/.env
    ports:
      - "127.0.0.1:18088:8080"
    volumes:
      - type: bind
        source: ${KAITEN_DATA_DIR:?Set the prepared Kaiten data directory}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
  kaiten-notifications:
    build: ../kaiten
    command: ["python", "telegram_worker.py"]
    restart: unless-stopped
    env_file: ../kaiten/.env
    volumes:
      - type: bind
        source: ${KAITEN_DATA_DIR:?Set the prepared Kaiten data directory}
        target: /data
        bind:
          create_host_path: false
    depends_on:
      kaiten:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  caddy:
    environment:
      KAITEN_TEST_DOMAIN: test-kaiten.n-smena.business
    volumes:
      - ./Caddyfile.with-kaiten:/etc/caddy/Caddyfile:ro
