name: ${COMPOSE_PROJECT_NAME:?Set the existing Compose project name in .env}
services:
  bot:
    build: ./bot
    restart: unless-stopped
    init: true
    env_file: ./bot/.env
    volumes:
      - bot_state:/app/data
    ports:
      - "127.0.0.1:3103:3103"
    stop_grace_period: 70s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:?Set BOT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
volumes:
  bot_state:
    external: true
    name: ${BOT_STATE_VOLUME:?Use the existing bot state volume}
  caddy_data:
    external: true
    name: ${CADDY_DATA_VOLUME:?Use the existing Caddy data volume}
  caddy_config:
    external: true
    name: ${CADDY_CONFIG_VOLUME:?Use the existing Caddy config volume}
